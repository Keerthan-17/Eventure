{% extends 'base.html' %}

{% block content %}
<br>
<div class="container">
    <div class="jumbotron">
        <h1>Welcome to the home page</h1>
        <div class="row">
            {% for i in events %}
            <div class="col-md-4 mb-4">
                <div class="custom-card">
                    {% if i.image %}
                    <div class="card-img-wrapper">
                        <img src="{{ i.image.url }}" alt="event image">
                    </div>
                    {% endif %}
                    
                    <div class="card-body-custom">
                        <h5><a href="{{ i.id }}">{{ i.name }}</a></h5>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
