{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/enquiry.css' %}">
{% endblock %}

{% block content %}

<div class="container enquiry-container">

    <div class="enquiry-card">
        <h2 class="enquiry-title">Enquiry Form</h2>
        <p class="enquiry-subtitle">We’ll get back to you shortly</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                {{ form.name }}
            </div>

            <div class="form-group">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="form-group">
                <label>Phone</label>
                {{ form.phone }}
            </div>

            <div class="form-group">
                <label>Message</label>
                {{ form.message }}
            </div>

            <button type="submit" class="btn btn-enquiry">Send Enquiry</button>
        </form>
    </div>

</div>

{% endblock %}
