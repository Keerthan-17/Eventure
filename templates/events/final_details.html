{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/final.css' %}">
{% endblock %}

{% block content %}

<div class="final-container">

    <div class="final-card">

        <h2 class="final-title">Finalize Your Booking</h2>
        <p class="final-subtitle">Review and confirm your catering details</p>

        <form method="post" action="{% url 'submit_final_details' %}">
            {% csrf_token %}

            <!-- Event Info -->
            <div class="form-row">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" name="event_name" value="{{ event_name }}" readonly class="input-style">
                </div>

                <div class="form-group">
                    <label>Event Type</label>
                    <select name="event_type" class="input-style" required>
                        <option value="" hidden>Select</option>
                        <option value="indoor">Indoor</option>
                        <option value="outdoor">Outdoor</option>
                    </select>
                </div>
            </div>

            <!-- Main Details -->
            <div class="form-row">
                <div class="form-group">
                    <label>Total People</label>
                    <input type="number" name="total_people" class="input-style" required>
                </div>

                <div class="form-group">
                    <label>Food Type</label>
                    <select name="food_type" id="food_type" class="input-style" onchange="updateMenuOptions()" required>
                        <option value="" hidden>Select</option>
                        <option value="veg">Veg</option>
                        <option value="nonveg">Non-Veg</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Menu Type</label>
                    <select name="menu_type" id="menu_type" class="input-style" required>
                        <option value="">Select Food Type First</option>
                    </select>
                </div>
            </div>

            <!-- Extra Inputs -->
            <div class="form-row">
                <div class="form-group">
                    <label>Suppliers</label>
                    <input type="number" name="no_of_suppliers" class="input-style" required>
                </div>

                <div class="form-group">
                    <label>Cake (kg)</label>
                    <input type="number" name="cake_required" min="0" value="0" class="input-style">
                    <small class="hint">0 means no cake</small>
                </div>
            </div>

            <!-- Add-ons -->
            <div class="addons">
                <label class="toggle">
                    <input type="checkbox" name="welcome_drinks">
                    <span class="toggle-box"></span>
                    <span class="toggle-text">Welcome Drinks</span>
                </label>

                <label class="toggle">
                    <input type="checkbox" name="welcome_chats">
                    <span class="toggle-box"></span>
                    <span class="toggle-text">Welcome Chats</span>
                </label>

                <label class="toggle">
                    <input type="checkbox" name="pan">
                    <span class="toggle-box"></span>
                    <span class="toggle-text">Pan</span>
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-confirm">Confirm Booking</button>

        </form>

    </div>

</div>

<script>
    function updateMenuOptions() {
        const foodType = document.getElementById('food_type').value;
        const menuType = document.getElementById('menu_type');
        menuType.innerHTML = ''; // clear previous options

        if (foodType === 'veg') {
            menuType.innerHTML = `
                <option value="1">Veg - Menu 1</option>
                <option value="2">Veg - Menu 2</option>
                <option value="3">Veg - Menu 3</option>
            `;
        } else if (foodType === 'nonveg') {
            menuType.innerHTML = `
                <option value="1">Non-Veg - Menu 1</option>
                <option value="2">Non-Veg - Menu 2</option>
                <option value="3">Non-Veg - Menu 3</option>
            `;
        } else {
            menuType.innerHTML = `<option value="">Select Food Type First</option>`;
        }
    }
</script>

{% endblock %}
